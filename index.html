  <!-- 保存图片到相册弹窗 -->
  <div id="saveModal" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 class="modal-title">保存高清图片</h2>
        <button id="closeModalBtn" type="button" class="modal-close" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-guide">
        <strong>手机保存方法：</strong>长按下方图片即可存储到手机相册（或点击下方系统分享按钮选择「存储图像」）。
      </div>

      <div class="modal-preview-box">
        <img id="exportedImage" src="" alt="编辑后的高清图片" />
      </div>

      <div class="modal-actions">
        <button id="systemShareBtn" type="button" class="modal-btn-share hidden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
          <span>系统分享 / 存相册</span>
        </button>

        <div class="modal-btn-row">
          <button id="downloadFileBtn" type="button" class="modal-btn-download">直接下载</button>
          <button id="continueEditBtn" type="button" class="modal-btn-back">继续编辑</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 轻量 Toast 提示（替代 alert） -->
  <div id="toast" class="toast"></div>

  <script>
    /**
     * 极简图片加字工具 - 核心逻辑（零外部依赖）
     * 支持：多文本框管理、双指缩放平移、手柄直调文本框宽高、中英文智能换行、原生高兼容上传与高清离屏导出
     */
    (function () {
      'use strict';

      // ========================
      // 1. 常量配置
      // ========================
      const MAX_CANVAS_SIDE = 2600; // 温和上限，保持高清同时避免移动端内存溢出
      const MIN_ZOOM = 1;
      const MAX_ZOOM = 5;
      const FONT_FAMILY = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif';

      // 六种常用字体颜色
      const PRESET_COLORS = [
        { name: '白色', value: '#FFFFFF' },
        { name: '黑色', value: '#111827' },
        { name: '黄色', value: '#FACC15' },
        { name: '红色', value: '#EF4444' },
        { name: '蓝色', value: '#3B82F6' },
        { name: '绿色', value: '#22C55E' }
      ];

      // ========================
      // 2. DOM 元素引用
      // ========================
      const fileInput = document.getElementById('fileInput');
      const saveImageBtn = document.getElementById('saveImageBtn');
      const uploadView = document.getElementById('uploadView');
      const editorView = document.getElementById('editorView');
      const canvasViewport = document.getElementById('canvasViewport');
      const canvas = document.getElementById('editorCanvas');
      const ctx = canvas.getContext('2d');
      const canvasHint = document.getElementById('canvasHint');
      const zoomResetBtn = document.getElementById('zoomResetBtn');
      const zoomPercent = document.getElementById('zoomPercent');

      const controlPanel = document.getElementById('controlPanel');
      // 新建文本框通过双击图片空白处完成
      
      const deleteBoxBtn = document.getElementById('deleteBoxBtn');
      const headerStyleToolbar = document.getElementById('canvasStyleToolbar');
      const boxControlsGroup = document.getElementById('boxControlsGroup');

      const textInput = document.getElementById('textInput');
      const finishEditBtn = document.getElementById('finishEditBtn');
      const clearTextBtn = document.getElementById('clearTextBtn');
      const floatingSizeControl = document.getElementById('floatingSizeControl');
      const sizeSlider = document.getElementById('sizeSlider');
      const sizeValue = document.getElementById('sizeValue');
      const colorRow = document.getElementById('colorRow');
      const colorMenuBtn = document.getElementById('colorMenuBtn');
      const strokeToggle = document.getElementById('strokeToggle');
      const bgToggle = document.getElementById('bgToggle');
      const boldToggle = document.getElementById('boldToggle');

      const saveModal = document.getElementById('saveModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const exportedImage = document.getElementById('exportedImage');
      const systemShareBtn = document.getElementById('systemShareBtn');
      const downloadFileBtn = document.getElementById('downloadFileBtn');
      const continueEditBtn = document.getElementById('continueEditBtn');
      const toastEl = document.getElementById('toast');

      // ========================
      // 3. 应用状态（多文本框数据模型）
      // ========================
      const state = {
        image: null,
        imageObjectUrl: null,
        canvasWidth: 0,
        canvasHeight: 0,

        // 多文本框数组（按渲染顺序排列，数组末尾为最顶层）
        boxes: [],
        selectedId: null,
        nextBoxId: 1,

        // 画布缩放与平移状态（仅影响预览）
        view: {
          zoom: 1,
          panX: 0,
          panY: 0
        },

        // 多点触控与拖拽交互状态
        activePointers: new Map(),
        interactionMode: 'none', // 'none' | 'drag-box' | 'resize-e' | 'resize-s' | 'resize-se' | 'pan-view' | 'pinch'
        pointerDownClientX: 0,
        pointerDownClientY: 0,
        pointerMoved: false,
        blankTapPending: false,

        startCanvasX: 0,
        startCanvasY: 0,
        startBoxX: 0,
        startBoxY: 0,
        startBoxW: 0,
        startBoxH: 0,

        panStartX: 0,
        panStartY: 0,
        initialPanX: 0,
        initialPanY: 0,

        pinchStartDist: 0,
        pinchStartMidX: 0,
        pinchStartMidY: 0,
        pinchStartZoom: 1,
        pinchStartPanX: 0,
        pinchStartPanY: 0,

        resetTimer: null,
        hintTimer: null,
        toastTimer: null,

        // 导出缓存
        exportUrl: null,
        exportFile: null
      };

      // 在键盘弹出时只移动极简输入浮栏，保持画布的坐标、缩放和位置不变。
      let textEditing = false;
      let editingWorkspaceHeight = 0;
      function positionEditingPanel() {
        if (!textEditing) return;
        const vv = window.visualViewport;
        const visibleBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
        const panelHeight = controlPanel.getBoundingClientRect().height;
        const top = Math.max(4, visibleBottom - panelHeight - 6);
        document.body.style.setProperty('--editing-panel-top', top + 'px');
      }
      function enterTextEditing() {
        if (textEditing || !state.image) return;
        // 记录现有工作区高度，再将控制面板从布局流中提出；图片不会因此重新居中。
        editingWorkspaceHeight = document.querySelector('.workspace').getBoundingClientRect().height;
        document.body.style.setProperty('--editing-workspace-height', editingWorkspaceHeight + 'px');
        textEditing = true;
        controlPanel.classList.remove('hidden');
        document.body.classList.add('text-editing');
        positionEditingPanel();
        requestAnimationFrame(positionEditingPanel);
      }
      function exitTextEditing() {
        if (!textEditing) return;
        removeEmptyBoxes();
        textEditing = false;
        document.body.classList.remove('text-editing');
        controlPanel.classList.add('hidden');
        document.body.style.removeProperty('--editing-panel-top');
        document.body.style.removeProperty('--editing-workspace-height');
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', positionEditingPanel);
        window.visualViewport.addEventListener('scroll', positionEditingPanel);
      }
      function focusTextEditor() {
        if (!getSelectedBox()) return;
        enterTextEditing();
        try { textInput.focus({preventScroll: true}); }
        catch (_) { textInput.focus(); }
        positionEditingPanel();
      }
      finishEditBtn.addEventListener('pointerdown', e => e.preventDefault());
      finishEditBtn.addEventListener('click', () => textInput.blur());

      // ========================
      // 4. 通用工具函数
      // ========================
      function clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      /** 轻量 Toast 提示 */
      function showToast(msg, duration = 2200) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, duration);
      }

      /** 判断颜色深浅，用于自动匹配高对比度描边与半透明底色 */
      function isDarkColor(hex) {
        const clean = (hex || '#FFFFFF').replace('#', '');
        const full = clean.length === 3
          ? clean.split('').map(c => c + c).join('')
          : clean;
        const r = parseInt(full.substring(0, 2), 16) || 0;
        const g = parseInt(full.substring(2, 4), 16) || 0;
        const b = parseInt(full.substring(4, 6), 16) || 0;
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum < 0.45;
      }

      /** 将字号滑块值（16~100）按图片基准边换算为真实 Canvas 像素字号 */
      function getPixelFontSize(sizeVal, w, h) {
        const base = Math.min(w, h) || 1000;
        return Math.max(16, Math.round(base * (sizeVal / 650)));
      }

      /** 获取当前 Canvas 内部像素与屏幕 CSS 像素的换算比例 */
      function getCssScale() {
        const rect = canvas.getBoundingClientRect();
        return rect.width > 0 ? state.canvasWidth / rect.width : 1;
      }

      /** 将屏幕坐标转换为 Canvas 内部像素坐标（自动适配任意缩放与平移） */
      function getCanvasPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = state.canvasWidth / rect.width;
        const scaleY = state.canvasHeight / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      /** 自动调节多行输入框高度 */
      function autoResizeTextarea() {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 92) + 'px';
      }

      /** 绘制圆角矩形路径 */
      function buildRoundedRectPath(context, x, y, w, h, r) {
        const radius = Math.max(0, Math.min(r, w / 2, h / 2));
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + w, y, x + w, y + h, radius);
        context.arcTo(x + w, y + h, x, y + h, radius);
        context.arcTo(x, y + h, x, y, radius);
        context.arcTo(x, y, x + w, y, radius);
        context.closePath();
      }

      // ========================
      // 5. 多文本框管理辅助函数
      // ========================
      function getSelectedBox() {
        if (state.selectedId === null) return null;
        return state.boxes.find(b => b.id === state.selectedId) || null;
      }

      function getSelectedIndex() {
        if (state.selectedId === null) return -1;
        return state.boxes.findIndex(b => b.id === state.selectedId);
      }

      // 离开没有有效文字的文本框时自动丢弃；空格、换行也视为无效内容。
      // 这里不主动 blur，避免拖动画布时关闭手机键盘。
      function removeEmptyBoxes(exceptId = null) {
        const before = state.boxes.length;
        state.boxes = state.boxes.filter(b => b.id === exceptId || Boolean((b.text || '').trim()));
        if (state.selectedId !== null && !state.boxes.some(b => b.id === state.selectedId)) {
          state.selectedId = null;
        }
        if (state.boxes.length !== before) {
          syncControls(true);
          renderEditor();
        }
      }

      /** 选中指定文本框，默认将其置顶（移至数组末尾） */
      function selectBox(id, bringToFront = true) {
        if (id === null || id === undefined) {
          state.selectedId = null;
          closeColorMenu();
          return null;
        }
        const idx = state.boxes.findIndex(b => b.id === id);
        if (idx === -1) {
          state.selectedId = null;
          return null;
        }
        if (bringToFront && idx !== state.boxes.length - 1) {
          const [picked] = state.boxes.splice(idx, 1);
          state.boxes.push(picked);
        }
        state.selectedId = id;
        removeEmptyBoxes(id);
        return getSelectedBox();
      }

      /** 创建初始居中文本框（宽 75% × 高 25%） */
      function createInitialBox() {
        const w = state.canvasWidth;
        const h = state.canvasHeight;
        const boxW = Math.round(w * 0.75);
        const boxH = Math.round(h * 0.25);

        return {
          id: state.nextBoxId++,
          text: '',
          isPlaceholder: true, // 仅在编辑画布中显示“新建文框”，不导出
          x: Math.round((w - boxW) / 2),
          y: Math.round((h - boxH) / 2),
          w: boxW,
          h: boxH,
          size: 42,
          color: '#FFFFFF',
          stroke: true,
          bg: false,
          bold: true
        };
      }

      /** 添加一个新的独立文本框（宽 65% × 高 20%，向右下错开且自动限制在画布内） */
      function addNewBox(atPoint = null) {
        if (!state.image) return;

        const w = state.canvasWidth;
        const h = state.canvasHeight;
        const boxW = Math.round(w * 0.65);
        const boxH = Math.round(h * 0.20);
        const maxX = Math.max(0, w - boxW);
        const maxY = Math.max(0, h - boxH);

        // 双击落点为新文本框中心，超出图片边缘时自动限制到图片内。
        let nextX = atPoint ? clamp(Math.round(atPoint.x - boxW / 2), 0, maxX) : Math.round((w - boxW) / 2);
        let nextY = atPoint ? clamp(Math.round(atPoint.y - boxH / 2), 0, maxY) : Math.round((h - boxH) / 2);

        const newBox = {
          id: state.nextBoxId++,
          text: '',
          isPlaceholder: true, // 仅在编辑画布中显示“新建文框”，不导出
          x: nextX,
          y: nextY,
          w: boxW,
          h: boxH,
          size: 42,
          color: '#FFFFFF',
          stroke: true,
          bg: false,
          bold: true
        };

        removeEmptyBoxes();
        state.boxes.push(newBox);
        state.selectedId = newBox.id;

        if (document.activeElement === textInput) {
          textInput.blur();
        }
        syncControls(true);
        renderEditor();
        focusTextEditor();
      }

      /** 删除当前选中的文本框 */
      function deleteSelectedBox() {
        const idx = getSelectedIndex();
        if (idx === -1) return;

        state.boxes.splice(idx, 1);

        // 删除后若还有其余文本框，自动选中最顶层的一个；全删空则 selectedId = null
        if (state.boxes.length > 0) {
          state.selectedId = state.boxes[state.boxes.length - 1].id;
        } else {
          state.selectedId = null;
        }

        if (document.activeElement === textInput) {
          textInput.blur();
        }
        syncControls(true);
        renderEditor();
        showToast('已删除当前文本框', 1400);
      }

      // ========================
      // 6. 中英文智能自动换行算法
      // ========================
      /**
       * 将多行文本按 maxWidth 智能折行：
       * - 保留用户手动回车换行
       * - 中文逐字换行，英文/数字按单词换行
       * - 超长单个英文词自动按字符拆分，避免水平溢出
       */
      function wrapSmartText(context, rawText, maxWidth) {
        const safeWidth = Math.max(10, maxWidth);
        const paragraphs = (rawText || '').split('\n');
        const resultLines = [];

        // 将段落拆分为「英文单词(含紧随标点/空格)」、「连续空白」或「单个中文/符号字符」
        const tokenRegex = /[A-Za-z0-9]+['’\-A-Za-z0-9]*[.,!?;:]*\s*|\s+|./gu;

        for (let p = 0; p < paragraphs.length; p++) {
          const para = paragraphs[p];
          if (para.length === 0) {
            resultLines.push('');
            continue;
          }

          const tokens = para.match(tokenRegex) || [para];
          let currentLine = '';

          for (let t = 0; t < tokens.length; t++) {
            const token = tokens[t];
            const candidate = currentLine + token;

            if (context.measureText(candidate).width <= safeWidth) {
              currentLine = candidate;
            } else {
              if (currentLine.length > 0) {
                resultLines.push(currentLine.replace(/\s+$/, ''));
                currentLine = '';
              }

              const trimmedToken = token.replace(/^\s+/, '');
              if (trimmedToken.length === 0) {
                continue;
              }

              if (context.measureText(trimmedToken).width <= safeWidth) {
                currentLine = trimmedToken;
              } else {
                // 超长单词/URL：逐字符拆分换行
                const chars = Array.from(trimmedToken);
                for (let c = 0; c < chars.length; c++) {
                  const ch = chars[c];
                  if (currentLine.length > 0 && context.measureText(currentLine + ch).width > safeWidth) {
                    resultLines.push(currentLine);
                    currentLine = ch;
                  } else {
                    currentLine += ch;
                  }
                }
              }
            }
          }

          if (currentLine.length > 0) {
            resultLines.push(currentLine.replace(/\s+$/, ''));
          }
        }

        return resultLines;
      }

      // ========================
      // 7. 视图缩放与平移控制
      // ========================
      function clampPan(zoom, panX, panY) {
        const vpW = canvasViewport.clientWidth || 0;
        const vpH = canvasViewport.clientHeight || 0;
        const scaledW = (canvas.offsetWidth || 0) * zoom;
        const scaledH = (canvas.offsetHeight || 0) * zoom;
        // 即使缩放是 100%，也允许单指把图片向四周移动；
        // 键盘打开时可把下方内容抬到键盘上方，画布不重新排版。
        const extraX = vpW * 0.68;
        const extraY = vpH * 0.85;
        const maxPanX = Math.max(0, (scaledW - vpW) / 2) + extraX;
        const maxPanY = Math.max(0, (scaledH - vpH) / 2) + extraY;
        return {
          panX: clamp(panX, -maxPanX, maxPanX),
          panY: clamp(panY, -maxPanY, maxPanY)
        };
      }

      function setViewTransform(zoom, panX, panY, smooth = false) {
        const nextZoom = clamp(zoom, MIN_ZOOM, MAX_ZOOM);
        const clamped = clampPan(nextZoom, panX, panY);

        state.view.zoom = nextZoom;
        state.view.panX = clamped.panX;
        state.view.panY = clamped.panY;

        canvas.style.transition = smooth ? 'transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)' : 'none';
        canvas.style.transform = `translate3d(${state.view.panX}px, ${state.view.panY}px, 0) scale(${state.view.zoom})`;

        if (state.view.zoom > 1.01) {
          zoomPercent.textContent = `${Math.round(state.view.zoom * 100)}%`;
          zoomResetBtn.classList.remove('hidden');
        } else {
          zoomResetBtn.classList.add('hidden');
        }
        positionDeleteButton();
      }

      function resetView(smooth = true) {
        clearTimeout(state.resetTimer);
        setViewTransform(1, 0, 0, smooth);
        if (smooth && state.image) {
          state.resetTimer = setTimeout(() => {
            canvas.style.transition = 'none';
            renderEditor();
          }, 230);
        }
      }

      /** 围绕双指中心点或鼠标指针位置缩放 */
      function zoomAroundPoint(targetZoom, fromMidX, fromMidY, toMidX, toMidY, baseZoom, basePanX, basePanY) {
        const vpRect = canvasViewport.getBoundingClientRect();
        const cx = vpRect.left + vpRect.width / 2;
        const cy = vpRect.top + vpRect.height / 2;

        const nextZoom = clamp(targetZoom, MIN_ZOOM, MAX_ZOOM);
        const ratio = nextZoom / baseZoom;

        const dx1 = fromMidX - cx;
        const dy1 = fromMidY - cy;
        const dx2 = toMidX - cx;
        const dy2 = toMidY - cy;

        const nextPanX = dx2 - (dx1 - basePanX) * ratio;
        const nextPanY = dy2 - (dy1 - basePanY) * ratio;

        setViewTransform(nextZoom, nextPanX, nextPanY, false);
        if (state.image) {
          renderEditor();
        }
      }

      // ========================
      // 8. 核心画布渲染（多文本框 & 离屏高清导出共用）
      // ========================
      function renderSingleBox(targetCtx, box, width, height, isSelected, forExport) {
        const displayText = (!forExport && box.isPlaceholder) ? '新建文框' : box.text;
        const hasText = Boolean(displayText && displayText.length > 0);
        const hasNonEmptyText = Boolean(displayText && displayText.trim().length > 0);

        // 导出模式下，若既无有效文字又无底色则跳过
        if (forExport && !hasNonEmptyText && !box.bg) {
          return;
        }

        const fontSize = getPixelFontSize(box.size, width, height);
        const weight = box.bold ? '700' : '400';
        const lineHeight = fontSize * 1.32;
        const padX = Math.max(10, fontSize * 0.36);
        const padY = Math.max(8, fontSize * 0.28);
        const cornerRadius = Math.max(8, fontSize * 0.28);
        const dark = isDarkColor(box.color);

        const innerW = Math.max(10, box.w - padX * 2);
        const innerH = Math.max(10, box.h - padY * 2);

        targetCtx.save();
        targetCtx.font = `${weight} ${fontSize}px ${FONT_FAMILY}`;
        targetCtx.textAlign = 'left'; // 统一清晰左对齐排版
        targetCtx.textBaseline = 'top';
        targetCtx.lineJoin = 'round';
        targetCtx.miterLimit = 2;

        const lines = hasText ? wrapSmartText(targetCtx, displayText, innerW) : [];
        const totalTextHeight = lines.length > 0
          ? (lines.length - 1) * lineHeight + fontSize * 1.08
          : 0;
        const isOverflow = totalTextHeight > innerH + 2;

        // 1. 在文本框范围内严格裁剪并绘制圆角底色与文字
        if (hasText || box.bg) {
          targetCtx.save();
          buildRoundedRectPath(targetCtx, box.x, box.y, box.w, box.h, cornerRadius);
          targetCtx.clip();

          // 半透明圆角底色框
          if (box.bg) {
            targetCtx.fillStyle = dark ? 'rgba(255, 255, 255, 0.82)' : 'rgba(11, 14, 20, 0.62)';
            targetCtx.fillRect(box.x, box.y, box.w, box.h);
          }

          // 左对齐逐行绘制文字
          if (hasText) {
            const textStartX = box.x + padX;
            const textStartY = box.y + padY;

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i];
              const lineY = textStartY + i * lineHeight;

              // 超出底部裁剪区域后停止绘制
              if (lineY > box.y + box.h) break;

              if (box.stroke) {
                targetCtx.strokeStyle = dark ? 'rgba(255, 255, 255, 0.92)' : 'rgba(0, 0, 0, 0.84)';
                targetCtx.lineWidth = Math.max(2, fontSize * 0.13);
                targetCtx.strokeText(line, textStartX, lineY);
              }

              targetCtx.fillStyle = box.color;
              targetCtx.fillText(line, textStartX, lineY);
            }
          }

          targetCtx.restore();
        }

        // 2. 仅当前选中的文本框在编辑态绘制双层虚线外框、溢出提醒条与 3 个调大小手柄
        if (!forExport && isSelected) {
          const cssScale = getCssScale();

          targetCtx.save();
          // 双层高对比度蓝色虚线外框
          targetCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          targetCtx.lineWidth = 2.2 * cssScale;
          targetCtx.setLineDash([]);
          targetCtx.strokeRect(box.x, box.y, box.w, box.h);

          targetCtx.strokeStyle = '#3B82F6';
          targetCtx.lineWidth = 1.8 * cssScale;
          targetCtx.setLineDash([6 * cssScale, 4 * cssScale]);
          targetCtx.strokeRect(box.x, box.y, box.w, box.h);
          targetCtx.setLineDash([]);

          // 若文字超出文本框高度，底部亮起橙红色提醒条
          if (isOverflow) {
            const barH = 4 * cssScale;
            targetCtx.fillStyle = '#F97316';
            targetCtx.fillRect(box.x, box.y + box.h - barH / 2, box.w, barH);
          }

          // 绘制 3 个大热区调节手柄：右中（调宽）、下中（调高）、右下角（同时调宽高）
          targetCtx.shadowColor = 'rgba(0, 0, 0, 0.45)';
          targetCtx.shadowBlur = 6 * cssScale;

          // (A) 右中手柄（竖向白色胶囊）
          const rx = box.x + box.w;
          const ry = box.y + box.h / 2;
          const rPillW = 8 * cssScale;
          const rPillH = 26 * cssScale;
          buildRoundedRectPath(targetCtx, rx - rPillW / 2, ry - rPillH / 2, rPillW, rPillH, rPillW / 2);
          targetCtx.fillStyle = '#FFFFFF';
          targetCtx.fill();
          targetCtx.lineWidth = 1.8 * cssScale;
          targetCtx.strokeStyle = '#3B82F6';
          targetCtx.stroke();

          // (B) 下中手柄（横向白色胶囊；溢出时高亮橙红色提示向下拉高）
          const bx = box.x + box.w / 2;
          const by = box.y + box.h;
          const bPillW = 26 * cssScale;
          const bPillH = 8 * cssScale;
          buildRoundedRectPath(targetCtx, bx - bPillW / 2, by - bPillH / 2, bPillW, bPillH, bPillH / 2);
          targetCtx.fillStyle = isOverflow ? '#F97316' : '#FFFFFF';
          targetCtx.fill();
          targetCtx.lineWidth = 1.8 * cssScale;
          targetCtx.strokeStyle = isOverflow ? '#FFFFFF' : '#3B82F6';
          targetCtx.stroke();

          // (C) 右下角手柄（圆形蓝底白边拖拽点，同时调宽高）
          const cx = box.x + box.w;
          const cy = box.y + box.h;
          const cornerR = 10 * cssScale;
          targetCtx.beginPath();
          targetCtx.arc(cx, cy, cornerR, 0, Math.PI * 2);
          targetCtx.fillStyle = '#3B82F6';
          targetCtx.fill();
          targetCtx.lineWidth = 2.4 * cssScale;
          targetCtx.strokeStyle = '#FFFFFF';
          targetCtx.stroke();

          // 右下角手柄内部白色小斜线指示
          targetCtx.shadowBlur = 0;
          targetCtx.beginPath();
          const d = cornerR * 0.36;
          targetCtx.moveTo(cx - d, cy + d);
          targetCtx.lineTo(cx + d, cy - d);
          targetCtx.strokeStyle = '#FFFFFF';
          targetCtx.lineWidth = 1.8 * cssScale;
          targetCtx.lineCap = 'round';
          targetCtx.stroke();

          targetCtx.restore();
        }

        targetCtx.restore();
      }

      function renderScene(targetCtx, width, height, forExport) {
        if (!state.image) return;

        targetCtx.clearRect(0, 0, width, height);
        // 1. 绘制高清原图
        targetCtx.drawImage(state.image, 0, 0, width, height);

        // 2. 按 state.boxes 顺序从底层到顶层依次渲染所有文本框
        for (let i = 0; i < state.boxes.length; i++) {
          const box = state.boxes[i];
          const isSelected = !forExport && box.id === state.selectedId;
          renderSingleBox(targetCtx, box, width, height, isSelected, forExport);
        }
      }

      function positionDeleteButton() {
        const box = getSelectedBox();
        if (!state.image || !box || editorView.classList.contains('hidden')) {
          deleteBoxBtn.classList.add('hidden');
          return;
        }
        const imageRect = canvas.getBoundingClientRect();
        const editorRect = editorView.getBoundingClientRect();
        if (!imageRect.width || !imageRect.height) return;
        const right = imageRect.left + (box.x + box.w) / state.canvasWidth * imageRect.width;
        const top = imageRect.top + box.y / state.canvasHeight * imageRect.height;
        // 右上角略微偏外放置，避免盖住正文和文本框拖动手柄。
        const left = clamp(right - editorRect.left - 11, 0, Math.max(0, editorRect.width - 32));
        const y = clamp(top - editorRect.top - 21, 0, Math.max(0, editorRect.height - 32));
        deleteBoxBtn.style.left = left + 'px';
        deleteBoxBtn.style.top = y + 'px';
        deleteBoxBtn.classList.remove('hidden');


      }

      function renderEditor() {
        renderScene(ctx, state.canvasWidth, state.canvasHeight, false);
        positionDeleteButton();
      }

      // ========================
      // 9. 底部面板控件初始化与同步
      // ========================
      function closeColorMenu() {
        colorRow.classList.add('hidden');
        colorMenuBtn.setAttribute('aria-expanded', 'false');
      }

      function initColorSwatches() {
        colorRow.innerHTML = '';
        PRESET_COLORS.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'color-swatch';
          btn.dataset.color = c.value;
          btn.title = c.name;
          btn.setAttribute('aria-label', c.name);
          btn.style.backgroundColor = c.value;
          btn.addEventListener('click', () => {
            const box = getSelectedBox();
            if (!box) return;
            box.color = c.value;
            closeColorMenu();
            syncControls();
            renderEditor();
          });
          colorRow.appendChild(btn);
        });
      }

      // 颜色按钮及六色选项不能抢走文字输入焦点，否则安卓键盘会自动关闭。
      // 在 pointerdown 阶段阻止按钮获取焦点，但不阻止后续 click 选择颜色。
      function preserveKeyboardOnColorPointer(e) {
        if (textEditing && document.activeElement === textInput) {
          e.preventDefault();
        }
      }
      colorMenuBtn.addEventListener('pointerdown', preserveKeyboardOnColorPointer);
      colorRow.addEventListener('pointerdown', preserveKeyboardOnColorPointer);

      colorMenuBtn.addEventListener('click', () => {
        if (!getSelectedBox()) return;
        const willOpen = colorRow.classList.contains('hidden');
        colorRow.classList.toggle('hidden', !willOpen);
        colorMenuBtn.setAttribute('aria-expanded', String(willOpen));
      });
      document.addEventListener('pointerdown', (e) => {
        if (!e.target.closest('.input-wrap')) closeColorMenu();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeColorMenu();
      });

      function syncControls(forceInputUpdate = false) {
        const box = getSelectedBox();
        const selectedIdx = getSelectedIndex();
        const hasSelection = Boolean(box);

        // 多文本框操作栏状态与删除按钮
        deleteBoxBtn.disabled = !hasSelection;
        if (!hasSelection) deleteBoxBtn.classList.add('hidden');


        // 柔和禁用态控制
        boxControlsGroup.classList.toggle('is-disabled', !hasSelection);
        textInput.disabled = !hasSelection;
        sizeSlider.disabled = !hasSelection;
        floatingSizeControl.classList.toggle('hidden', !hasSelection || !state.image);
        strokeToggle.disabled = !hasSelection;
        bgToggle.disabled = !hasSelection;
        boldToggle.disabled = !hasSelection;

        colorMenuBtn.disabled = !hasSelection;
        if (!hasSelection) closeColorMenu();

        if (!hasSelection) {
          textInput.value = '';
          textInput.placeholder = '双击图片空白位置添加文字';
          autoResizeTextarea();
          clearTextBtn.classList.add('hidden');

          colorRow.querySelectorAll('.color-swatch').forEach(btn => btn.classList.remove('active'));

          strokeToggle.classList.remove('active');
          bgToggle.classList.remove('active');
          boldToggle.classList.remove('active');
          return;
        }

        textInput.placeholder = box.isPlaceholder ? '点击输入文字…' : '输入文字（超出框宽自动换行，支持回车）...';

        // 输入框与清空按钮
        if (forceInputUpdate || document.activeElement !== textInput) {
          textInput.value = box.text;
          autoResizeTextarea();
        }
        clearTextBtn.classList.toggle('hidden', box.text.length === 0);

        // 字号
        sizeSlider.value = box.size;
        sizeValue.textContent = box.size;

        // 颜色选中状态
        const swatches = colorRow.querySelectorAll('.color-swatch');
        swatches.forEach(btn => {
          const isMatch = btn.dataset.color.toUpperCase() === box.color.toUpperCase();
          btn.classList.toggle('active', isMatch);
        });

        colorMenuBtn.style.color = box.color;

        // 三个独立样式开关
        strokeToggle.classList.toggle('active', box.stroke);
        bgToggle.classList.toggle('active', box.bg);
        boldToggle.classList.toggle('active', box.bold);
        strokeToggle.setAttribute('aria-pressed', String(box.stroke));
        bgToggle.setAttribute('aria-pressed', String(box.bg));
        boldToggle.setAttribute('aria-pressed', String(box.bold));
      }

      // ========================
      // 10. 高兼容移动端图片加载（createObjectURL 优先，失败自动回退 FileReader）
      // ========================
      function applyLoadedImage(img, objectUrlToKeep) {
        try {
          if (state.imageObjectUrl && state.imageObjectUrl !== objectUrlToKeep) {
            URL.revokeObjectURL(state.imageObjectUrl);
          }

          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;

          if (!w || !h) {
            showToast('图片尺寸异常，请更换其他图片');
            return;
          }

          if (w > MAX_CANVAS_SIDE || h > MAX_CANVAS_SIDE) {
            const ratio = Math.min(MAX_CANVAS_SIDE / w, MAX_CANVAS_SIDE / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }

          state.image = img;
          state.imageObjectUrl = objectUrlToKeep || null;
          state.canvasWidth = w;
          state.canvasHeight = h;

          canvas.width = w;
          canvas.height = h;

          // 上传图片后默认居中创建 1 个宽 75% × 高 25% 的文本框并自动选中
          state.boxes = [];
          state.nextBoxId = 1;
          state.selectedId = null;

          exitTextEditing();
          // 切换到编辑状态
          uploadView.classList.add('hidden');
          editorView.classList.remove('hidden');
          controlPanel.classList.add('hidden');
          saveImageBtn.disabled = false;

          // 换图自动复位缩放与平移
          resetView(false);
          syncControls(true);
          renderEditor();

          // 显示并自动淡出操作轻提示
          clearTimeout(state.hintTimer);
          canvasHint.classList.remove('fade-out');
          state.hintTimer = setTimeout(() => {
            canvasHint.classList.add('fade-out');
          }, 3600);
        } catch (err) {
          console.error(err);
          showToast('图片初始化失败，请重试');
        }
      }

      /** 回退方案：通过 FileReader.readAsDataURL 读取图片 */
      function loadImageViaFileReader(file) {
        try {
          const reader = new FileReader();
          reader.onload = function (ev) {
            const dataUrl = ev.target && ev.target.result;
            if (!dataUrl) {
              showToast('读取图片内容失败，请重试');
              return;
            }
            const fallbackImg = new Image();
            fallbackImg.onload = function () {
              applyLoadedImage(fallbackImg, null);
            };
            fallbackImg.onerror = function () {
              showToast('图片格式暂不支持（如原始 HEIC）或文件已损坏');
            };
            fallbackImg.src = dataUrl;
          };
          reader.onerror = function () {
            showToast('无法读取该文件，请检查手机相册权限后重试');
          };
          reader.readAsDataURL(file);
        } catch (err) {
          console.error(err);
          showToast('浏览器无法读取该图片文件，请换一张试试');
        }
      }

      function handleImageFile(file) {
        if (!file) return;

        // 部分安卓文件管理器返回的 file.type 可能为空字符串，仅当明确非图片类型时拦截
        if (file.type && !file.type.startsWith('image/')) {
          showToast('请选择有效的图片文件（JPG / PNG / WebP 等）');
          return;
        }

        // 优先使用 URL.createObjectURL，异常或解码失败时自动回退 FileReader
        let objectUrl = null;
        try {
          objectUrl = URL.createObjectURL(file);
        } catch (err) {
          console.warn('createObjectURL 不可用，自动回退 FileReader:', err);
          loadImageViaFileReader(file);
          return;
        }

        const img = new Image();
        img.onload = function () {
          applyLoadedImage(img, objectUrl);
        };
        img.onerror = function () {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl);
          }
          // 自动尝试 FileReader 回退解码
          loadImageViaFileReader(file);
        };
        img.src = objectUrl;
      }

      // ========================
      // 11. 画布手势：手柄调宽高、多框点击切换与拖动、空白取消选中、双指缩放平移、滚轮缩放
      // ========================
      function beginPinchGesture() {
        const pts = Array.from(state.activePointers.values());
        if (pts.length < 2) return;
        const p1 = pts[0];
        const p2 = pts[1];

        state.interactionMode = 'pinch';
        state.pinchStartDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
        state.pinchStartMidX = (p1.x + p2.x) / 2;
        state.pinchStartMidY = (p1.y + p2.y) / 2;
        state.pinchStartZoom = state.view.zoom;
        state.pinchStartPanX = state.view.panX;
        state.pinchStartPanY = state.view.panY;
      }

      /**
       * 命中检测优先级：
       * (1) 当前选中框的 3 个调大小手柄（28px/26px * cssScale 大热区）
       * (2) 倒序遍历 state.boxes（从顶层到底层）检测文本框区域
       * (3) 空白处
       */
      function hitTestCanvas(pt) {
        const cssScale = getCssScale();
        const cornerHitR = 28 * cssScale;
        const edgeHitR = 26 * cssScale;
        const selected = getSelectedBox();

        // 1. 优先命中当前选中文本框的 3 个手柄
        if (selected) {
          if (Math.hypot(pt.x - (selected.x + selected.w), pt.y - (selected.y + selected.h)) <= cornerHitR) {
            return { type: 'resize-se', boxId: selected.id };
          }
          if (Math.hypot(pt.x - (selected.x + selected.w), pt.y - (selected.y + selected.h / 2)) <= edgeHitR) {
            return { type: 'resize-e', boxId: selected.id };
          }
          if (Math.hypot(pt.x - (selected.x + selected.w / 2), pt.y - (selected.y + selected.h)) <= edgeHitR) {
            return { type: 'resize-s', boxId: selected.id };
          }
        }

        // 2. 倒序遍历所有文本框（最顶层优先命中）
        for (let i = state.boxes.length - 1; i >= 0; i--) {
          const box = state.boxes[i];
          if (
            pt.x >= box.x &&
            pt.x <= box.x + box.w &&
            pt.y >= box.y &&
            pt.y <= box.y + box.h
          ) {
            return { type: 'drag-box', boxId: box.id };
          }
        }

        // 3. 空白处
        return { type: 'blank', boxId: null };
      }

      canvasViewport.addEventListener('pointerdown', (e) => {
        if (!state.image) return;
        e.preventDefault();
        try {
          canvasViewport.setPointerCapture(e.pointerId);
        } catch (_) {}

        clearTimeout(state.resetTimer);
        canvas.style.transition = 'none';
        state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        // 第二根手指按下时立即切入双指缩放平移，绝不与单指冲突
        if (state.activePointers.size >= 2) {
          state.blankTapPending = false;
          beginPinchGesture();
          return;
        }

        state.pointerDownClientX = e.clientX;
        state.pointerDownClientY = e.clientY;
        state.pointerMoved = false;
        state.blankTapPending = false;

        const pt = getCanvasPoint(e.clientX, e.clientY);
        const hit = hitTestCanvas(pt);

        if (hit.type === 'resize-se' || hit.type === 'resize-e' || hit.type === 'resize-s') {
          const box = getSelectedBox();
          if (!box) return;
          state.interactionMode = hit.type;
          state.startCanvasX = pt.x;
          state.startCanvasY = pt.y;
          state.startBoxX = box.x;
          state.startBoxY = box.y;
          state.startBoxW = box.w;
          state.startBoxH = box.h;

        } else if (hit.type === 'drag-box') {
          // 命中文本框：立即选中并置顶，同步底部面板
          const box = selectBox(hit.boxId, true);
          if (!box) return;

          state.interactionMode = 'drag-box';
          state.startCanvasX = pt.x;
          state.startCanvasY = pt.y;
          state.startBoxX = box.x;
          state.startBoxY = box.y;
          state.startBoxW = box.w;
          state.startBoxH = box.h;

          syncControls(true);
          renderEditor();
        } else {
          // 落点在空白处：单指可以随时平移图片（即使 100% 缩放、键盘已打开）
          state.blankTapPending = true;
          state.panStartX = e.clientX;
          state.panStartY = e.clientY;
          state.initialPanX = state.view.panX;
          state.initialPanY = state.view.panY;
          state.interactionMode = 'pan-view';
        }
      });

      canvasViewport.addEventListener('pointermove', (e) => {
        if (!state.activePointers.has(e.pointerId)) return;
        e.preventDefault();

        state.activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (Math.hypot(e.clientX - state.pointerDownClientX, e.clientY - state.pointerDownClientY) >= 6) {
          state.pointerMoved = true;
        }

        // 双指缩放与平移
        if (state.interactionMode === 'pinch' && state.activePointers.size >= 2) {
          const pts = Array.from(state.activePointers.values());
          const p1 = pts[0];
          const p2 = pts[1];
          const currDist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          const currMidX = (p1.x + p2.x) / 2;
          const currMidY = (p1.y + p2.y) / 2;

          const scaleFactor = currDist / Math.max(10, state.pinchStartDist);
          const targetZoom = state.pinchStartZoom * scaleFactor;

          zoomAroundPoint(
            targetZoom,
            state.pinchStartMidX,
            state.pinchStartMidY,
            currMidX,
            currMidY,
            state.pinchStartZoom,
            state.pinchStartPanX,
            state.pinchStartPanY
          );
          return;
        }

        // 单指拖动当前选中文本框位置（1:1 跟随）
        if (state.interactionMode === 'drag-box') {
          const box = getSelectedBox();
          if (!box) return;
          const pt = getCanvasPoint(e.clientX, e.clientY);
          const dx = pt.x - state.startCanvasX;
          const dy = pt.y - state.startCanvasY;
          const maxX = Math.max(0, state.canvasWidth - box.w);
          const maxY = Math.max(0, state.canvasHeight - box.h);
          box.x = clamp(state.startBoxX + dx, 0, maxX);
          box.y = clamp(state.startBoxY + dy, 0, maxY);
          renderEditor();
          return;
        }

        // 手柄调整当前选中文本框宽高
        if (
          state.interactionMode === 'resize-e' ||
          state.interactionMode === 'resize-s' ||
          state.interactionMode === 'resize-se'
        ) {
          const box = getSelectedBox();
          if (!box) return;
          const pt = getCanvasPoint(e.clientX, e.clientY);
          const dx = pt.x - state.startCanvasX;
          const dy = pt.y - state.startCanvasY;
          const fontSize = getPixelFontSize(box.size, state.canvasWidth, state.canvasHeight);
          const minW = Math.max(state.canvasWidth * 0.14, fontSize * 2.2);
          const minH = Math.max(state.canvasHeight * 0.08, fontSize * 1.6);

          if (state.interactionMode === 'resize-e' || state.interactionMode === 'resize-se') {
            const maxW = state.canvasWidth - box.x;
            box.w = clamp(state.startBoxW + dx, minW, maxW);
          }
          if (state.interactionMode === 'resize-s' || state.interactionMode === 'resize-se') {
            const maxH = state.canvasHeight - box.y;
            box.h = clamp(state.startBoxH + dy, minH, maxH);
          }
          renderEditor();
          return;
        }

        // 单指拖动空白区域平移图片；保留文本输入焦点和手机键盘
        if (state.interactionMode === 'pan-view') {
          const dx = e.clientX - state.panStartX;
          const dy = e.clientY - state.panStartY;
          setViewTransform(state.view.zoom, state.initialPanX + dx, state.initialPanY + dy, false);
        }
      });

      let lastBlankTap = null;
      function handlePointerEnd(e) {
        if (!state.activePointers.has(e.pointerId)) return;
        state.activePointers.delete(e.pointerId);
        try {
          canvasViewport.releasePointerCapture(e.pointerId);
        } catch (_) {}

        // 双指松开一指时，若仍处于放大态则无缝切换为单指平移，防止画面跳动
        if (state.activePointers.size === 1 && state.interactionMode === 'pinch') {
          const remaining = Array.from(state.activePointers.values())[0];
          state.panStartX = remaining.x;
          state.panStartY = remaining.y;
          state.initialPanX = state.view.panX;
          state.initialPanY = state.view.panY;
          state.interactionMode = 'pan-view';
          return;
        }

        if (state.activePointers.size === 0) {
          // 两次在图片空白处轻点（350ms 内、距离 32px 内）创建文本框。
          // 单击空白处仅取消选中；在文本框上轻点仍可编辑，拖动不会触发新建。
          if (state.blankTapPending && !state.pointerMoved && e.type === 'pointerup') {
            const now = performance.now();
            const inImage = (() => {
              const r = canvas.getBoundingClientRect();
              return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
            })();
            if (inImage && lastBlankTap && now - lastBlankTap.time < 360 &&
                Math.hypot(e.clientX - lastBlankTap.x, e.clientY - lastBlankTap.y) < 34) {
              lastBlankTap = null;
              const at = getCanvasPoint(e.clientX, e.clientY);
              addNewBox(at);
            } else {
              lastBlankTap = inImage ? {time: now, x: e.clientX, y: e.clientY} : null;
              if (state.selectedId !== null) {
                state.selectedId = null;
                removeEmptyBoxes();
                syncControls(true);
                renderEditor();
              }
            }
          } else if (state.pointerMoved || state.interactionMode === 'pinch' || state.interactionMode === 'drag-box') {
            lastBlankTap = null;
          }
          // 轻点文本框即打开输入键盘；拖动文本框不触发编辑。
          if (state.interactionMode === 'drag-box' && !state.pointerMoved) {
            focusTextEditor();
          }
          state.blankTapPending = false;
          state.interactionMode = 'none';
        }
      }

      canvasViewport.addEventListener('pointerup', handlePointerEnd);
      canvasViewport.addEventListener('pointercancel', handlePointerEnd);

      // 桌面端鼠标滚轮缩放
      canvasViewport.addEventListener('wheel', (e) => {
        if (!state.image) return;
        e.preventDefault();
        clearTimeout(state.resetTimer);

        const factor = Math.exp(-e.deltaY * 0.0018);
        const targetZoom = state.view.zoom * factor;

        zoomAroundPoint(
          targetZoom,
          e.clientX,
          e.clientY,
          e.clientX,
          e.clientY,
          state.view.zoom,
          state.view.panX,
          state.view.panY
        );
      }, { passive: false });

      zoomResetBtn.addEventListener('click', () => {
        resetView(true);
      });

      // ========================
      // 12. 文件选择与底部控件事件绑定
      // ========================
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          handleImageFile(file);
        }
        // 加载启动后立即清空 value，允许用户重复选择同一张图片
        fileInput.value = '';
      });


      // 点击样式图标时保留输入焦点，避免键盘不必要地收起。
      headerStyleToolbar.addEventListener('pointerdown', e => {
        e.stopPropagation();
        if (document.activeElement === textInput) e.preventDefault();
      });
      deleteBoxBtn.addEventListener('pointerdown', e => e.stopPropagation());
      deleteBoxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSelectedBox();
      });

      // 第一次点入新文框时，提示文字自动消失，直接开始输入。
      textInput.addEventListener('focus', () => {
        enterTextEditing();
        const box = getSelectedBox();
        if (!box || !box.isPlaceholder) return;
        box.isPlaceholder = false;
        textInput.value = '';
        textInput.placeholder = '输入文字（超出框宽自动换行，支持回车）...';
        clearTextBtn.classList.add('hidden');
        renderEditor();
      });

      textInput.addEventListener('blur', () => {
        // 某些手机在弹出颜色选择器等控件时会短暂失焦。
        // 等待焦点确定离开输入区，再恢复完整面板。
        setTimeout(() => {
          if (document.activeElement !== textInput) exitTextEditing();
        }, 80);
      });

      textInput.addEventListener('input', () => {
        const box = getSelectedBox();
        if (!box) return;
        autoResizeTextarea();
        positionEditingPanel();
        box.isPlaceholder = false;
        box.text = textInput.value;
        clearTextBtn.classList.toggle('hidden', box.text.length === 0);
        renderEditor();
      });

      clearTextBtn.addEventListener('click', () => {
        const box = getSelectedBox();
        if (!box) return;
        box.text = '';
        box.isPlaceholder = false;
        textInput.value = '';
        autoResizeTextarea();
        clearTextBtn.classList.add('hidden');
        textInput.focus();
        renderEditor();
      });

      sizeSlider.addEventListener('input', (e) => {
        const box = getSelectedBox();
        if (!box) return;
        const val = parseInt(e.target.value, 10);
        box.size = val;
        sizeValue.textContent = val;
        renderEditor();
      });

      strokeToggle.addEventListener('click', () => {
        const box = getSelectedBox();
        if (!box) return;
        box.stroke = !box.stroke;
        syncControls();
        renderEditor();
      });

      bgToggle.addEventListener('click', () => {
        const box = getSelectedBox();
        if (!box) return;
        box.bg = !box.bg;
        syncControls();
        renderEditor();
      });

      boldToggle.addEventListener('click', () => {
        const box = getSelectedBox();
        if (!box) return;
        box.bold = !box.bold;
        syncControls();
        renderEditor();
      });

      window.addEventListener('resize', () => {
        positionEditingPanel();
        if (state.image) {
          setViewTransform(state.view.zoom, state.view.panX, state.view.panY, false);
          renderEditor();
        }
      });

      // ========================
      // 13. 离屏高清纯净导出与手机相册保存弹窗
      // ========================
      function cleanupExport() {
        if (state.exportUrl) {
          URL.revokeObjectURL(state.exportUrl);
          state.exportUrl = null;
        }
        state.exportFile = null;
      }

      function openSaveModal() {
        if (!state.image) return;

        try {
          // 使用离屏 Canvas 按原图分辨率纯净绘制所有文本框（自动隐藏虚线框、手柄和溢出提醒条）
          const offCanvas = document.createElement('canvas');
          offCanvas.width = state.canvasWidth;
          offCanvas.height = state.canvasHeight;
          const offCtx = offCanvas.getContext('2d');
          renderScene(offCtx, offCanvas.width, offCanvas.height, true);

          offCanvas.toBlob((blob) => {
            if (!blob) {
              showToast('生成图片失败，请重试');
              return;
            }

            cleanupExport();
            state.exportUrl = URL.createObjectURL(blob);

            const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
            const filename = `极简加字_${stamp}.jpg`;
            state.exportFile = new File([blob], filename, { type: 'image/jpeg' });

            exportedImage.src = state.exportUrl;

            const canShare = Boolean(
              navigator.share &&
              navigator.canShare &&
              navigator.canShare({ files: [state.exportFile] })
            );
            systemShareBtn.classList.toggle('hidden', !canShare);

            saveModal.classList.remove('hidden');
          }, 'image/jpeg', 0.94);
        } catch (err) {
          console.error(err);
          showToast('导出失败，请重试');
        }
      }

      function closeSaveModal() {
        saveModal.classList.add('hidden');
      }

      saveImageBtn.addEventListener('click', openSaveModal);
      closeModalBtn.addEventListener('click', closeSaveModal);
      continueEditBtn.addEventListener('click', closeSaveModal);

      saveModal.addEventListener('click', (e) => {
        if (e.target === saveModal) closeSaveModal();
      });

      systemShareBtn.addEventListener('click', async () => {
        if (!state.exportFile) return;
        try {
          await navigator.share({
            files: [state.exportFile],
            title: '极简加字图片'
          });
        } catch (err) {
          if (err && err.name !== 'AbortError') {
            showToast('系统分享不可用，请长按图片保存');
          }
        }
      });

      downloadFileBtn.addEventListener('click', () => {
        if (!state.exportUrl || !state.exportFile) return;
        try {
          const a = document.createElement('a');
          a.href = state.exportUrl;
          a.download = state.exportFile.name;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          showToast('已开始下载，也可长按图片存入相册');
        } catch (err) {
          console.error(err);
          showToast('请长按上方图片保存到相册');
        }
      });

      // 初始化
      initColorSwatches();
      syncControls(true);
    })();
  </script>
</body>
</html>
