<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>极简图片加字工具</title>
  <style>
    /* ========================
       1. 深色极简工作室基础变量
       ======================== */
    :root {
      --bg-app: #0b0e14;
      --bg-surface: #141923;
      --bg-elevated: #1d2433;
      --bg-elevated-hover: #252e40;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.18);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.14);
      --danger-border: rgba(239, 68, 68, 0.34);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Inter", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button {
      font-family: inherit;
      border: none;
      outline: none;
      cursor: pointer;
      color: inherit;
      background: transparent;
      padding: 0;
    }

    button:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    textarea, input {
      font-family: inherit;
      user-select: text;
      -webkit-user-select: text;
    }

    .hidden {
      display: none !important;
    }

    /* 视觉隐藏文件输入框（不使用 display:none，以兼容各类安卓/iOS浏览器原生 label 触发） */
    .visually-hidden-input {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* ========================
       2. 顶部极简导航栏
       ======================== */
    .app-header {
      flex-shrink: 0;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: rgba(20, 25, 35, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 20;
    }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-primary);
      opacity: 0.9;
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 13px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .btn-ghost:active {
      transform: scale(0.95);
      background: var(--bg-elevated-hover);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 15px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.32);
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.95);
      background: var(--accent-hover);
    }

    /* ========================
       3. 中央工作区与画布视口
       ======================== */
    .workspace {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      background: radial-gradient(circle at center, #141a26 0%, #0b0e14 75%);
    }

    /* 未选图引导卡片（原生 label 直接关联 fileInput） */
    .upload-view {
      width: 100%;
      max-width: 360px;
    }

    .upload-card {
      width: 100%;
      padding: 42px 24px;
      border-radius: 26px;
      background: rgba(20, 25, 35, 0.85);
      border: 1.5px dashed rgba(148, 163, 184, 0.28);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.2s ease, background-color 0.2s ease;
    }

    .upload-card:active {
      transform: scale(0.985);
      border-color: var(--accent);
      background: rgba(29, 36, 51, 0.9);
    }

    .upload-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--accent-soft);
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .upload-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 22px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.28);
    }

    .upload-sub {
      margin: 0;
      font-size: 12px;
      line-height: 1.65;
      color: var(--text-secondary);
    }

    /* 画布编辑区 */
    .editor-view {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 16px;
    }

    #canvasViewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    #editorCanvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      transform-origin: center center;
      will-change: transform;
      touch-action: none;
    }

    /* 顶部轻提示 */
    .canvas-hint {
      pointer-events: none;
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      background: rgba(11, 14, 20, 0.78);
      border: 1px solid var(--border-subtle);
      color: #e2e8f0;
      font-size: 11px;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: opacity 0.35s ease;
      z-index: 10;
    }

    .canvas-hint.fade-out {
      opacity: 0;
    }

    /* 右下角缩放状态与一键复原胶囊 */
    .zoom-pill {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 12;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease;
    }

    .zoom-pill:active {
      transform: scale(0.94);
    }

    .zoom-pill-divider {
      opacity: 0.35;
    }

    .zoom-percent {
      font-variant-numeric: tabular-nums;
    }

    /* ========================
       4. 极简底部控制面板（多文本框操作栏 + 基础极简控件）
       ======================== */
    .control-panel {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
      z-index: 20;
    }

    .control-inner {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 多文本框操作栏 */
    .multi-box-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-add-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-full);
      background: var(--accent-soft);
      border: 1px solid rgba(59, 130, 246, 0.42);
      color: #93c5fd;
      font-size: 12.5px;
      font-weight: 600;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }

    .btn-add-box:active {
      transform: scale(0.95);
      background: rgba(59, 130, 246, 0.28);
    }

    .box-status-label {
      flex: 1;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .btn-delete-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 34px;
      padding: 0 12px;
      border-radius: var(--radius-full);
      background: var(--danger-soft);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      font-size: 12.5px;
      font-weight: 500;
      flex-shrink: 0;
      transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
    }

    .btn-delete-box:active {
      transform: scale(0.95);
      background: rgba(239, 68, 68, 0.24);
    }

    /* 选中文本框属性控制组（未选中时柔和禁用） */
    .box-controls-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.18s ease;
    }

    .box-controls-group.is-disabled {
      opacity: 0.42;
      pointer-events: none;
    }

    /* 第 1 行：多行输入框 + 一键清空（font-size: 16px 防止 iPhone Safari 聚焦放大） */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .text-input {
      width: 100%;
      min-height: 44px;
      max-height: 92px;
      padding: 10px 76px 10px 13px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.4;
      outline: none;
      resize: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .text-input::placeholder {
      color: var(--text-muted);
      font-size: 14px;
    }

    .text-input:focus {
      border-color: var(--accent);
      background: #202838;
    }

    .clear-input-btn {
      position: absolute;
      right: 43px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: rgba(148, 163, 184, 0.22);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .clear-input-btn:active {
      transform: translateY(-50%) scale(0.9);
      background: rgba(148, 163, 184, 0.36);
    }

    /* 第 2 行：字号滑块 */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .row-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .size-value {
      width: 32px;
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 24px;
      background: transparent;
      cursor: pointer;
      margin: 0;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: var(--radius-full);
      background: rgba(148, 163, 184, 0.25);
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: #ffffff;
      border: 3px solid var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
      margin-top: -8.5px;
      transition: transform 0.12s ease;
    }

    input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.14);
    }

    /* 输入框内颜色图标与向上弹出的六色面板 */
    .input-color-btn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: rgba(148, 163, 184, 0.13);
      border: 1px solid var(--border-subtle);
      z-index: 2;
    }
    .input-color-btn[aria-expanded="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .input-color-btn svg { pointer-events: none; }
    .color-row {
      position: absolute;
      right: 0;
      bottom: calc(100% + 9px);
      z-index: 30;
      display: grid;
      grid-template-columns: repeat(3, 38px);
      gap: 9px;
      padding: 12px;
      border: 1px solid var(--border-strong);
      border-radius: 15px;
      background: #252e40;
      box-shadow: 0 12px 32px rgba(0,0,0,.52);
    }
    .color-row.hidden { display: none !important; }
    .color-swatch {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      transition: transform .12s, box-shadow .12s;
    }
    .color-swatch:active { transform: scale(.92); }
    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px var(--accent);
    }

    /* 第 4 行：描边 / 底色 / 加粗 三个独立开关胶囊 */
    .style-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .style-pill {
      height: 36px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .style-pill:active {
      transform: scale(0.96);
    }

    .style-pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
      font-weight: 600;
    }

    /* ========================
       5. 保存图片到相册弹窗
       ======================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 7, 11, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    @media (min-width: 640px) {
      .modal-backdrop {
        align-items: center;
        padding: 16px;
      }
    }

    .modal-sheet {
      width: 100%;
      max-width: 440px;
      max-height: 92dvh;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 24px 24px 0 0;
      padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @media (min-width: 640px) {
      .modal-sheet {
        border-radius: 24px;
        padding: 20px;
      }
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-guide {
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.28);
      color: #bfdbfe;
      border-radius: var(--radius-md);
      padding: 10px 13px;
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .modal-preview-box {
      flex: 1;
      min-height: 0;
      background: var(--bg-app);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #exportedImage {
      max-width: 100%;
      max-height: 44dvh;
      width: auto;
      height: auto;
      border-radius: 10px;
      object-fit: contain;
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-btn-share {
      width: 100%;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .modal-btn-row {
      display: flex;
      gap: 8px;
    }

    .modal-btn-download {
      flex: 1;
      height: 42px;
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-btn-back {
      padding: 0 18px;
      height: 42px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
    }

    /* ========================
       6. 轻量 Toast 提示
       ======================== */
    .toast {
      pointer-events: none;
      position: fixed;
      top: calc(64px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      z-index: 60;
      max-width: calc(100vw - 32px);
      padding: 9px 16px;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f8fafc;
      font-size: 12.5px;
      font-weight: 500;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 五个操作按钮共处一行，适配窄屏手机 */
    .multi-box-bar { gap: 5px; }
    .multi-box-bar .btn-add-box { padding: 0 9px; height: 34px; font-size: 11px; gap: 3px; }
    .multi-box-bar .btn-delete-box { padding: 0 9px; height: 34px; font-size: 11px; }
    .multi-box-bar .style-row {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 0 0 auto;
    }
    .multi-box-bar .style-pill {
      height: 34px;
      min-width: 39px;
      padding: 0 6px;
      border-radius: 10px;
      font-size: 11px;
    }
    .multi-box-bar .style-symbol { width: 19px; height: 19px; display: block; flex-shrink: 0; }
    .multi-box-bar .style-pill { display: inline-flex; justify-content: center; align-items: center; }
    .multi-box-bar .box-status-label { display: none; }
    @media (min-width: 560px) {
      .multi-box-bar .box-status-label { display: block; }
      .multi-box-bar { gap: 8px; }
      .multi-box-bar .style-row { gap: 7px; }
      .multi-box-bar .style-pill { min-width: 46px; font-size: 12px; padding: 0 8px; }
      .multi-box-bar .btn-add-box, .multi-box-bar .btn-delete-box { font-size: 12px; }
    }
    @media (max-width: 350px) {
      .multi-box-bar { gap: 3px; }
      .multi-box-bar .style-row { gap: 3px; }
      .multi-box-bar .style-pill { min-width: 35px; padding: 0 4px; font-size: 10.5px; }

    }

    /* 屏幕左上角竖向字号滑块，避开底部键盘上方的输入框 */
    .floating-size-control {
      position: fixed;
      left: max(6px, env(safe-area-inset-left));
      top: calc(76px + env(safe-area-inset-top));
      z-index: 32;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      width: 44px;
      padding: 11px 4px;
      border-radius: 24px;
      background: rgba(20,25,35,.72);
      border: 1px solid rgba(255,255,255,.14);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 16px rgba(0,0,0,.22);
    }
    .floating-size-control.is-disabled { display: none !important; }
    .floating-size-value {
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #f8fafc;
    }
    .floating-size-track {
      width: 30px;
      height: 166px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .floating-size-track #sizeSlider {
      position: absolute;
      flex: none;
      width: 166px;
      height: 30px;
      margin: 0;
      transform: rotate(-90deg);
      touch-action: none;
    }
    .floating-size-caption {
      font-size: 10px;
      color: #cbd5e1;
      white-space: nowrap;
    }
    body.text-editing .floating-size-control {
      /* 键盘出现后依然固定于屏幕左上角，不参与布局 */
      z-index: 42;
    }

    /* 文本输入模式：锁定画布位置，控制栏浮在键盘上缘而非挤动画布 */
    body.text-editing .workspace {
      flex: 0 0 auto;
      height: var(--editing-workspace-height);
    }
    body.text-editing .control-panel {
      position: fixed;
      top: var(--editing-panel-top, auto);
      bottom: auto;
      left: 8px;
      right: 8px;
      width: auto;
      padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 15px;
      background: rgba(20,25,35,.84);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 22px rgba(0,0,0,.24);
      z-index: 40;
    }
    body.text-editing .control-inner { gap: 0; }
    body.text-editing .multi-box-bar,
    body.text-editing .slider-row { display: none; }
    body.text-editing .box-controls-group { gap: 0; }
    body.text-editing .text-input {
      min-height: 39px;
      max-height: 80px;
      padding: 8px 110px 8px 11px;
      background: rgba(29,36,51,.78);
    }
    body.text-editing .input-color-btn { right: 49px; }
    body.text-editing .clear-input-btn { right: 85px; }
    .finish-edit-btn {
      display: none;
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      height: 31px;
      padding: 0 9px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      background: #2563eb;
      z-index: 3;
    }
    body.text-editing .finish-edit-btn { display: block; }


    /* 三个样式按钮固定在顶部导航栏中央，替代“极简加字”标题 */
    .app-header { position: relative; }
    .header-style-toolbar {
      position: absolute;
      left: 50%;
      top: calc(10px + env(safe-area-inset-top));
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 22;
      touch-action: manipulation;
    }
    .header-style-toolbar .style-pill {
      width: 34px;
      min-width: 34px;
      height: 36px;
      padding: 0;
      border-radius: 10px;
    }
    .header-style-toolbar .style-symbol { width: 19px; height: 19px; display: block; }
    @media (max-width: 370px) {
      .header-style-toolbar { gap: 3px; }
      .header-style-toolbar .style-pill { width: 30px; min-width: 30px; }
      .app-header .btn-ghost { padding: 0 9px; }
      .app-header .btn-primary { padding: 0 10px; }
    }

    /* 删除按钮跟随选中文本框右上角，独立于画布缩放及底部面板 */
    .canvas-delete-box {
      position: absolute;
      left: 0;
      top: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #fff;
      background: rgba(210, 45, 58, .94);
      border: 1.5px solid rgba(255,255,255,.85);
      box-shadow: 0 2px 9px rgba(0,0,0,.5);
      z-index: 18;
      touch-action: manipulation;
    }
    .canvas-delete-box:active { transform: scale(.94); }
  </style>
</head>
<body>

  <!-- 顶部极简导航栏 -->
  <header class="app-header">
    <!-- 使用原生 label 直接触发 fileInput，最大程度兼容安卓与 iPhone -->
    <label for="fileInput" id="changeImageBtn" class="btn-ghost" role="button" tabindex="0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>

      <span>换图</span>
    </label>

        <!-- 顶栏中央：描边、底色、加粗 -->
        <div id="canvasStyleToolbar" class="style-row header-style-toolbar" role="group" aria-label="文本框样式">
          <button id="strokeToggle" type="button" class="style-pill" aria-label="描边" title="描边" aria-pressed="false">
            <svg class="style-symbol" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">

          <button id="bgToggle" type="button" class="style-pill" aria-label="底色" title="底色" aria-pressed="false">
            <svg class="style-symbol" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
              <rect x="2.5" y="3" width="19" height="18" rx="3" />
              <path d="M3 15h18v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z" fill="currentColor" opacity=".35" stroke="none"/>
              <path d="m7 15 3.1-8h3.8l3.1 8M8.3 12h7.4" />
            </svg>
          </button>
          <button id="boldToggle" type="button" class="style-pill" aria-label="加粗" title="加粗" aria-pressed="false">
            <svg class="style-symbol" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M6 3.5h7.1c4 0 6.3 2.1 6.3 5.1 0 1.8-.9 3.1-2.5 3.8 2.2.6 3.4 2.1 3.4 4.2 0 3.4-2.6 5.4-6.7 5.4H6zm4.2 3.4v4h2.5c1.6 0 2.4-.7 2.4-2 0-1.2-.9-2-2.4-2zm0 7.2v4.5h3c1.8 0 2.7-.8 2.7-2.3 0-1.4-.9-2.2-2.7-2.2z"/>
            </svg>
          </button>
        </div>

    <button id="saveImageBtn" type="button" class="btn-primary" disabled>
      <span>保存图片</span>
    </button>
  </header>

  <!-- 视觉隐藏的文件选择器（不使用 display:none） -->
  <input id="fileInput" type="file" accept="image/*" class="visually-hidden-input" />

  <!-- 中央工作区 -->
  <main class="workspace">
    <!-- 未选图引导区（原生 label 直接关联 fileInput） -->
    <div id="uploadView" class="upload-view">
      <label for="fileInput" id="uploadTrigger" class="upload-card" role="button" tabindex="0">
        <div class="upload-icon-box">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </div>
        <span class="upload-cta">选择手机里的图片</span>
        <p class="upload-sub">
          纯本地处理，不上传服务器<br />
          双击图片添加文字 · 双指缩放与手拖大小
        </p>
      </label>
    </div>

    <!-- 画布编辑区 -->
    <div id="editorView" class="editor-view hidden">
      <div id="canvasViewport">
        <canvas id="editorCanvas"></canvas>
      </div>

      <!-- 当前选中文本框的右上角删除按钮，不占底部工具栏空间 -->
      <button id="deleteBoxBtn" type="button" class="canvas-delete-box hidden" aria-label="删除当前文本框" title="删除当前文本框" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <!-- 顶部轻提示 -->
      <div id="canvasHint" class="canvas-hint">
        双击空白处加文字 · 点文字编辑 · 双指缩放
      </div>

      <!-- 放大时显示的一键复原胶囊 -->
      <button id="zoomResetBtn" type="button" class="zoom-pill hidden">
        <span id="zoomPercent" class="zoom-percent">100%</span>
        <span class="zoom-pill-divider">|</span>
        <span>复原</span>
      </button>
    </div>
  </main>

  <!-- 左侧中部悬浮字号控件：不占用底部面板高度 -->
  <div id="floatingSizeControl" class="floating-size-control hidden" aria-label="字号调整">
    <span id="sizeValue" class="floating-size-value">42</span>
    <div class="floating-size-track">
      <input id="sizeSlider" type="range" min="16" max="100" value="42" aria-label="字号大小" />
    </div>
    <span class="floating-size-caption">字号</span>
  </div>

  <!-- 极简底部控制面板（选图后显示） -->
  <footer id="controlPanel" class="control-panel hidden">
    <div class="control-inner">

      <!-- 选中文本框的属性编辑区（未选中时柔和禁用） -->
      <div id="boxControlsGroup" class="box-controls-group">
        <!-- 第 1 行：多行输入框 + 一键清空小按钮 -->
        <div class="input-wrap">
          <textarea
            id="textInput"
            class="text-input"
            rows="1"
            placeholder="输入文字（超出框宽自动换行，支持回车）..."
          ></textarea>
          <button id="colorMenuBtn" type="button" class="input-color-btn" aria-label="选择字体颜色" title="选择字体颜色" aria-expanded="false" aria-controls="colorRow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 19h14" stroke-width="2.7"></path>
              <path d="m8 16 4-11 4 11M9.3 12.5h5.4"></path>
            </svg>
          </button>
          <div id="colorRow" class="color-row hidden" role="group" aria-label="六种字体颜色"></div>
          <button id="finishEditBtn" type="button" class="finish-edit-btn">完成</button>
          <button id="clearTextBtn" type="button" class="clear-input-btn hidden" aria-label="清空文字" title="清空文字">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>


      </div>

    </div>
